<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080808" />
    <title>Sign in · VOID Music</title>
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-art">
        <div class="auth-orbit"></div>
        <div class="auth-brand"><span>V</span> VOID</div>
        <p class="auth-kicker">YOUR MUSIC. YOUR VOID.</p>
        <h1>A quieter place<br />for your music.</h1>
        <p class="auth-copy">Search YouTube, save favorites, build queues, and keep your listening space yours.</p>
      </section>
      <section class="auth-card">
        <div class="auth-mobile-brand"><span>V</span> VOID</div>
        <p class="eyebrow">WELCOME BACK</p>
        <h2 id="formTitle">Sign in</h2>
        <p class="auth-subtitle" id="formSubtitle">Log in to enter your personal music player.</p>
        <form id="authForm">
          <label id="nameField" class="hidden">Your name<input id="name" type="text" autocomplete="name" placeholder="Your name" maxlength="50" /></label>
          <label>Email address<input id="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com" required /></label>
          <label>Password<input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters" minlength="6" required /></label>
          <p id="authError" class="auth-error" role="alert"></p>
          <button class="auth-submit" type="submit" id="submitButton">Sign in <span>→</span></button>
        </form>
        <p class="switch-mode"><span id="switchText">New to VOID?</span> <button id="switchButton" type="button">Create an account</button></p>
      </section>
    </main>
    <script src="auth.js"></script>
  </body>
</html>
